<!DOCTYPE html>
<!-- ETW v2.1 -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETW — Explaining The World</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Mono:wght@300;400&family=Source+Serif+4:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
html,body{
  background:#0A0F2E;
  color:#F0EDE6;
  overflow-x:hidden;
  font-family:'Source Serif 4',serif;
}

#globe-canvas{
  position:fixed;
  top:0;left:0;
  width:100vw;height:100vh;
  z-index:0;
  pointer-events:none;
  display:block;
  opacity:0.7;
}

/* NAV */
#nav{
  position:fixed;
  top:0;left:0;right:0;
  z-index:100;
  background:transparent;
  padding:28px 56px;
  display:flex;
  align-items:center;
}
.nav-logo{
  font-family:'Playfair Display',serif;
  font-weight:700;
  color:#C4932A;
  font-size:16px;
  letter-spacing:0.35em;
  text-indent:0.35em;
  text-decoration:none;
}

/* HERO */
.hero{
  position:relative;
  z-index:10;
  height:100vh;
  background:transparent;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
  padding:0 32px;
}
.hero-label{
  font-family:'DM Mono',monospace;
  color:#C4932A;
  font-size:10px;
  letter-spacing:0.5em;
  text-transform:uppercase;
  margin-bottom:24px;
}
.hero-title{
  font-family:'Playfair Display',serif;
  font-weight:700;
  color:#F0EDE6;
  font-size:clamp(72px,13vw,148px);
  letter-spacing:0.15em;
  text-indent:0.15em;
  line-height:1;
  text-shadow:0 0 80px rgba(0,0,0,0.95);
}
.hero-rule{
  width:80px;
  height:1px;
  background:#C4932A;
  margin:28px auto 0;
}

/* PANELS (about + history, stacked) */
.panels{
  position:relative;
  z-index:10;
  width:100%;
}
.panel{
  width:100%;
  min-height:500px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:80px 48px;
  cursor:pointer;
  border:1px solid rgba(255,255,255,0.08);
  transition:border-color 0.4s;
}
.panel:hover{border-color:rgba(196,147,42,0.5);}
#about{background:rgba(255,255,255,0.04);}
#about:hover{border-color:rgba(196,147,42,0.5);}
#history{background:rgba(13,11,8,0.65);}

.about-label{
  font-family:'DM Mono',monospace;
  color:#C4932A;
  font-size:10px;
  letter-spacing:0.5em;
  text-transform:uppercase;
}
.about-rule{
  width:60px;
  height:1px;
  background:#C4932A;
  margin:16px auto;
}
.about-title{
  font-family:'Playfair Display',serif;
  font-weight:700;
  color:#F0EDE6;
  font-size:clamp(52px,9vw,80px);
  letter-spacing:0.15em;
  line-height:1.1;
}
.about-quote{
  font-family:'Source Serif 4',serif;
  font-style:italic;
  color:rgba(196,147,42,0.8);
  font-size:15px;
  max-width:400px;
  margin:20px auto 0;
  line-height:1.9;
}
.about-cta{
  font-family:'DM Mono',monospace;
  color:#C4932A;
  font-size:10px;
  letter-spacing:0.35em;
  text-transform:uppercase;
  margin-top:40px;
  display:block;
}
.hist-label{
  font-family:'DM Mono',monospace;
  color:rgba(196,147,42,0.7);
  font-size:9px;
  letter-spacing:0.5em;
  text-transform:uppercase;
  margin-bottom:20px;
}
.hist-rule{
  width:50px;
  height:1px;
  background:#C4932A;
  margin:0 auto 24px;
}
.hist-title{
  font-family:'Playfair Display',serif;
  font-weight:700;
  color:#F0EDE6;
  font-size:clamp(48px,8vw,80px);
  letter-spacing:0.15em;
}
.hist-tag{
  font-family:'Source Serif 4',serif;
  font-style:italic;
  color:rgba(196,147,42,0.8);
  font-size:15px;
  max-width:400px;
  margin:28px auto 0;
  line-height:1.9;
}
.hist-cta{
  font-family:'DM Mono',monospace;
  color:rgba(196,147,42,0.6);
  font-size:10px;
  letter-spacing:0.4em;
  text-transform:uppercase;
  margin-top:56px;
  display:block;
}

/* FOOTER */
footer{
  position:relative;
  z-index:10;
  background:#0A0F2E;
  padding:20px;
  text-align:center;
}
.footer-copy{
  font-family:'DM Mono',monospace;
  color:rgba(240,237,230,0.25);
  font-size:10px;
  letter-spacing:0.15em;
  white-space:nowrap;
}

/* MOBILE */
@media(max-width:768px){
  #nav{padding:20px 24px;}
  .hero{padding:0 24px;}
  .panel{padding:60px 28px;}
}
</style>
</head>
<body>

<canvas id="globe-canvas"></canvas>

<nav id="nav">
  <a href="/" class="nav-logo">ETW</a>
</nav>

<section class="hero">
  <p class="hero-label">Explaining The World</p>
  <h1 class="hero-title">ETW</h1>
  <div class="hero-rule"></div>
</section>

<section class="panels">
  <div id="about" class="panel" onclick="window.location='/about'">
    <p class="about-label">About</p>
    <div class="about-rule"></div>
    <h2 class="about-title">EXPLAINING THE WORLD</h2>
    <p class="about-quote">We provide what is valuable.<br>Not what is popular.</p>
    <span class="about-cta">EXPLORE &#x2192;</span>
  </div>
  <div id="history" class="panel" onclick="window.location='/history'">
    <p class="hist-label">ETW</p>
    <div class="hist-rule"></div>
    <h2 class="hist-title">HISTORY</h2>
    <p class="hist-tag">Lessons from every empire and its leader.<br>History through one lens only — power.</p>
    <span class="hist-cta">EXPLORE &#x2192;</span>
  </div>
</section>

<footer>
  <p class="footer-copy">&#169; 2026 Explaining The World. All Rights Reserved.</p>
</footer>

<script>
(function(){
  var canvas = document.getElementById('globe-canvas');
  var ctx = canvas.getContext('2d');
  var W, H, cx, cy, R;
  var rotDeg = 0;

  var CONTS = [
    // Africa
    [[35.8,-5.9],[37.3,9.9],[33.9,10.0],
     [30.9,19.5],[31.5,25.0],[31.6,34.5],
     [12.0,43.5],[10.4,44.9],[1.7,41.9],
     [-4.7,39.2],[-15.5,40.0],[-25.5,33.0],
     [-34.4,25.7],[-34.8,19.9],[-28.6,16.5],
     [-17.2,11.7],[-5.0,8.9],[4.4,5.6],
     [4.8,-2.0],[6.5,-7.5],[10.6,-15.0],
     [15.0,-17.0],[20.8,-17.0],[27.7,-13.0],
     [33.7,-5.5],[35.8,-5.9]],
    // Europe
    [[36.0,-9.5],[43.4,-9.2],[48.5,-4.8],
     [51.5,-5.0],[58.0,-7.0],[58.5,5.5],
     [62.0,5.0],[71.0,25.0],[68.0,40.0],
     [60.0,30.0],[55.0,21.0],[45.0,29.0],
     [40.0,26.0],[38.0,23.0],[36.5,15.0],
     [43.0,7.0],[43.0,-2.0],[36.0,-5.5],
     [36.0,-9.5]],
    // Asia
    [[36.0,26.0],[40.0,26.0],[41.0,28.0],
     [45.0,37.0],[40.0,49.0],[47.0,52.0],
     [55.0,50.0],[68.0,55.0],[73.0,70.0],
     [77.0,104.0],[73.0,140.0],[66.0,170.0],
     [60.0,160.0],[52.0,142.0],[45.0,135.0],
     [35.0,129.0],[30.0,122.0],[22.0,115.0],
     [10.0,105.0],[1.0,104.0],[7.0,98.0],
     [16.0,94.0],[22.0,90.0],[8.0,77.0],
     [23.0,68.0],[25.0,57.0],[29.0,48.0],
     [37.0,36.0],[36.0,26.0]],
    // North America
    [[71.0,-156.0],[69.0,-141.0],[60.0,-140.0],
     [55.0,-131.0],[48.0,-124.0],[40.0,-124.0],
     [32.0,-117.0],[23.0,-110.0],[20.0,-105.0],
     [16.0,-95.0],[18.0,-88.0],[21.0,-87.0],
     [25.0,-80.0],[30.0,-81.0],[35.0,-76.0],
     [40.0,-74.0],[45.0,-67.0],[47.0,-60.0],
     [52.0,-56.0],[60.0,-64.0],[63.0,-78.0],
     [58.0,-94.0],[69.0,-95.0],[71.0,-127.0],
     [71.0,-156.0]],
    // South America
    [[12.0,-71.0],[11.0,-64.0],[5.0,-52.0],
     [-1.0,-49.0],[-5.0,-35.0],[-13.0,-38.0],
     [-23.0,-41.0],[-30.0,-50.0],[-38.0,-58.0],
     [-50.0,-69.0],[-55.0,-68.0],[-52.0,-74.0],
     [-42.0,-74.0],[-30.0,-71.0],[-18.0,-70.0],
     [-5.0,-81.0],[2.0,-80.0],[8.0,-77.0],
     [12.0,-71.0]],
    // Australia
    [[-11.0,131.0],[-12.0,137.0],[-16.0,146.0],
     [-25.0,153.0],[-34.0,151.0],[-38.0,145.0],
     [-35.0,137.0],[-32.0,129.0],[-34.0,123.0],
     [-31.0,115.0],[-22.0,114.0],[-17.0,123.0],
     [-14.0,127.0],[-11.0,131.0]]
  ];

  // Centroid [latDeg, lonDeg] for culling
  var CENTS = CONTS.map(function(p){
    var n=p.length-1, la=0, lo=0;
    for(var i=0;i<n;i++){la+=p[i][0];lo+=p[i][1];}
    return [la/n, lo/n];
  });

  function resize(){
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    cx = W/2; cy = H/2;
    R = Math.min(W,H)*0.40;
  }

  function proj(lat, lon){
    var lonR = (lon - rotDeg) * Math.PI/180;
    var latR = lat * Math.PI/180;
    return {
      x: cx + R * Math.cos(latR) * Math.sin(lonR),
      y: cy - R * Math.sin(latR)
    };
  }

  function frame(){
    ctx.clearRect(0,0,W,H);

    ctx.save();
    ctx.beginPath();
    ctx.arc(cx,cy,R,0,Math.PI*2);
    ctx.clip();

    ctx.fillStyle = 'rgba(80,55,25,0.35)';
    ctx.strokeStyle = 'rgba(196,147,42,0.5)';
    ctx.lineWidth = 0.8;

    for(var i=0;i<CONTS.length;i++){
      var c = CENTS[i];
      var cLonR = (c[1]-rotDeg)*Math.PI/180;
      var cLatR = c[0]*Math.PI/180;
      if(Math.cos(cLatR)*Math.cos(cLonR) <= 0) continue;

      var poly = CONTS[i];
      ctx.beginPath();
      for(var j=0;j<poly.length;j++){
        var p = proj(poly[j][0],poly[j][1]);
        if(j===0) ctx.moveTo(p.x,p.y);
        else ctx.lineTo(p.x,p.y);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }

    ctx.restore();

    // Atmosphere — blue glow
    var ag = ctx.createRadialGradient(cx,cy,R*0.92,cx,cy,R*1.18);
    ag.addColorStop(0,'rgba(100,140,255,0.07)');
    ag.addColorStop(0.6,'rgba(100,140,255,0.02)');
    ag.addColorStop(1,'rgba(100,140,255,0)');
    ctx.beginPath();
    ctx.arc(cx,cy,R*1.18,0,Math.PI*2);
    ctx.fillStyle = ag;
    ctx.fill();

    rotDeg += 0.02;
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);
}());
</script>
</body>
</html>
